# =============================================================================
# Serenity BDD configuration (HOCON format)
# Primary configuration for the DemoBlaze E2E Screenplay suite
# =============================================================================

webdriver {
  # Custom driver source using WebDriverManager (ManagedChromeDriver)
  driver = provided
  provided {
    type = chrome
    chrome = "com.demoblaze.automation.drivers.ManagedChromeDriver"
  }
  autodownload = true
  timeouts {
    implicitlywait = 0
    fluentwait = 10000
    pageLoadTimeout = 30000
    script = 30000
  }
}

# Headless mode: enable via -Dheadless.mode=true or -Pheadless
headless.mode = false

serenity {
  project.name = "DemoBlaze E2E Purchase Flow"
  test.root = "com.demoblaze.automation"
  take.screenshots = FOR_FAILURES
  report {
    accessibility = true
  }
  logging = VERBOSE
  browser.maximized = true
  # Close the browser after every scenario (custom DriverSource still quit in Hooks)
  restart.browser.for.each = scenario
  timeout = 10000
  wait.for.timeout = 10000
}

webdriver.quit.automatically = true

# Environment-specific base URL
environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com"
  }
}
