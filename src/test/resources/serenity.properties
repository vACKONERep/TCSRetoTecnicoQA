# =============================================================================
# Serenity classic properties (complements serenity.conf)
# =============================================================================
serenity.project.name=DemoBlaze E2E Purchase Flow

# WebDriverManager-backed custom Chrome driver (see ManagedChromeDriver)
webdriver.driver=provided
webdriver.provided.type=chrome
webdriver.provided.chrome=com.demoblaze.automation.drivers.ManagedChromeDriver
webdriver.base.url=https://www.demoblaze.com

# Explicit waits (ms) — no Thread.sleep
webdriver.wait.for.timeout=10000
webdriver.timeouts.implicitlywait=0
serenity.timeout=10000

# Screenshots: failures only keeps reports lean; change to FOR_EACH_ACTION for demos
serenity.take.screenshots=FOR_FAILURES

# Browser lifecycle — restart/quit after every scenario so Chrome does not linger
serenity.browser.maximized=true
serenity.restart.browser.for.each=scenario
webdriver.quit.automatically=true

# Headless (overridden by -Dheadless.mode=true)
headless.mode=false
